<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head><body>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var f=document.createElement('iframe');
  f.style.cssText='width:1440px;height:20000px;border:0';
  f.src="product/nmrv_chervyachni.html";
  f.addEventListener('load', function(){
    setTimeout(function(){
      try{
        var d=f.contentDocument, w=f.contentWindow;
        var vw=d.documentElement.clientWidth, bad=[];
        d.querySelectorAll('body *').forEach(function(el){
          var r=el.getBoundingClientRect();
          if(r.width>0 && (r.right>vw+1 || r.left<-1)){
            var cs=w.getComputedStyle(el);
            if(cs.position==='fixed') return;
            if(el.closest('.marquee-slider,.swiper,.swiper-wrapper')) return;
            bad.push(el.tagName.toLowerCase()+'.'+(el.className||'').toString().slice(0,40)+' ['+Math.round(r.left)+'..'+Math.round(r.right)+']');
          }
        });
        var pre=document.createElement('pre'); pre.id='ovf';
        pre.textContent=JSON.stringify({vw:vw,scrollW:d.documentElement.scrollWidth,scrollH:d.documentElement.scrollHeight,bad:bad.slice(0,12)});
        document.body.appendChild(pre);
      }catch(e){var p=document.createElement('pre');p.id='ovf';p.textContent='ERR '+e;document.body.appendChild(p);}
    },700);
  });
  document.body.appendChild(f);
});
</script></body></html>
